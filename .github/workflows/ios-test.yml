name: Personal iOS test build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      osm_client_id:
        description: Optional live OSM client ID registered for network.vee.openstop.test://oauth2
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Unpack source snapshot
        run: unzip -q source.zip -d app
      - name: Configure personal test app
        run: python3 prepare_ios.py app
      - name: Read Flutter version
        id: flutter
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^  flutter: ([0-9.]+)$', Path('app/pubspec.yaml').read_text(), re.M).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Authenticate Flutter SDK checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth_header"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $auth_header"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: master
      - name: Generate app sources
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
      - name: Build unsigned device app
        working-directory: app
        env:
          OSM_TEST_CLIENT_ID: ${{ inputs.osm_client_id || 'ByoAb9j_P7WpVhnqmxViglgZE213Z9CwpX0PZakAEAc' }}
          THUNDERFOREST_API_KEY: ${{ secrets.THUNDERFOREST_API_KEY }}
        run: |
          build_number=$((1000 + GITHUB_RUN_NUMBER))
          # Keep test versions below upstream releases and distinct for SideStore updates.
          build_name="0.0.${build_number}"
          args=(--release --no-codesign "--build-name=$build_name" "--build-number=$build_number" --dart-define=IS_RELEASE=true --dart-define=OSM_SERVER=www.openstreetmap.org --dart-define=OSM_REDIRECT_URI=network.vee.openstop.test://oauth2)
          if [ -n "$OSM_TEST_CLIENT_ID" ]; then
            args+=("--dart-define=OSM_CLIENT_ID=$OSM_TEST_CLIENT_ID")
          fi
          args+=("--dart-define=THUNDERFOREST_API_KEY=$THUNDERFOREST_API_KEY")
          flutter build ios "${args[@]}" --verbose
      - name: Package unsigned IPA for local signing
        working-directory: app
        run: |
          mkdir -p build/ios/package/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/package/Payload/
          cd build/ios/package
          /usr/bin/zip -qry ../OpenStop-personal-test-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: OpenStop-personal-test-unsigned
          path: app/build/ios/OpenStop-personal-test-unsigned.ipa
          retention-days: 1
          if-no-files-found: error
